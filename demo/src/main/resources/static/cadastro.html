<!DOCTYPE html>
<!-- TELA ADMIN: LISTA DE CLIENTES CADASTRADOS (exige login) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes cadastrados</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="oculto">
    <header class="topo">
        <strong>Arthur Martins Teixeira Coragem</strong>
        <div>
            <span class="usuario">Logado como <span id="emailLogado"></span></span>
            <button class="secundario" id="btnSair">Sair</button>
        </div>
    </header>

    <main class="conteudo conteudo-estreito">
        <section class="cartao">
            <h2>Clientes cadastrados <span id="total" class="usuario"></span></h2>

            <div class="abas">
                <button id="abaTodos" class="ativa">Listar todos</button>
                <button id="abaBuscar">Buscar por ID / E-mail</button>
            </div>

            <div id="painelTodos">
                <ul id="lista" class="lista"></ul>
            </div>

            <div id="painelBuscar" class="oculto">
                <form id="formBusca" class="linha-busca">
                    <input id="termoBusca" placeholder="Digite o ID (ex.: 2) ou o e-mail" required>
                    <button type="submit">Buscar</button>
                </form>
            </div>

            <div id="msgBusca" class="alerta"></div>

            <div id="detalhe" class="detalhe oculto">
                <h3>Cadastro #<span data-campo="id"></span></h3>
                <dl>
                    <dt>Nome</dt>       <dd data-campo="nome"></dd>
                    <dt>Endereço</dt>   <dd data-campo="endereco"></dd>
                    <dt>CEP</dt>        <dd data-campo="cep"></dd>
                    <dt>Número</dt>     <dd data-campo="numero"></dd>
                    <dt>Telefone</dt>   <dd data-campo="telefone"></dd>
                    <dt>Observação</dt> <dd data-campo="observacao"></dd>
                    <dt>E-mail</dt>     <dd data-campo="email"></dd>
                    <dt>Criado em</dt>  <dd data-campo="criadoEm"></dd>
                </dl>
            </div>
        </section>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);

        function mostrar(elemento, texto, tipo) {
            elemento.textContent = texto;
            elemento.className = "alerta " + tipo;
        }
        function esconder(elemento) { elemento.className = "alerta"; }

        // Qualquer 401 = sessão acabou -> volta ao login
        async function chamar(url) {
            const resposta = await fetch(url);
            if (resposta.status === 401) {
                window.location.href = "/criptografia.html";
                throw new Error("não logado");
            }
            return resposta;
        }

        async function verificarLogin() {
            const resposta = await fetch("/usuario");
            if (!resposta.ok) {
                window.location.href = "/criptografia.html";
                return;
            }
            $("emailLogado").textContent = await resposta.text();
            document.body.classList.remove("oculto");
            carregarLista();
        }

        async function carregarLista() {
            const ul = $("lista");
            try {
                const resposta = await chamar("/cadastros");
                const cadastros = await resposta.json();

                ul.innerHTML = "";
                if (!resposta.ok) {
                    ul.innerHTML = `<li class="vazio">${cadastros.erro}</li>`;
                    return;
                }
                $("total").textContent = `(${cadastros.length})`;
                if (cadastros.length === 0) {
                    ul.innerHTML = '<li class="vazio">Nenhum cliente cadastrado ainda.</li>';
                    return;
                }
                for (const c of cadastros) {
                    const li = document.createElement("li");
                    const esquerda = document.createElement("span");
                    const id = document.createElement("span");
                    id.className = "id";
                    id.textContent = "#" + c.id;
                    esquerda.append(id, c.nome);
                    const email = document.createElement("span");
                    email.className = "email";
                    email.textContent = c.email;
                    li.append(esquerda, email);
                    li.title = "Clique para ver os detalhes";
                    li.addEventListener("click", () => buscar(String(c.id)));
                    ul.appendChild(li);
                }
            } catch { /* já tratado */ }
        }

        async function buscar(termo) {
            termo = termo.trim();
            const msg = $("msgBusca");
            esconder(msg);
            $("detalhe").classList.add("oculto");

            const url = /^\d+$/.test(termo)
                ? "/cadastros/" + termo
                : "/cadastros/busca?email=" + encodeURIComponent(termo);

            try {
                const resposta = await chamar(url);
                const corpo = await resposta.json();
                if (!resposta.ok) {
                    mostrar(msg, corpo.erro || "Não encontrado.", "erro");
                    return;
                }
                exibirDetalhe(corpo);
            } catch { /* já tratado */ }
        }

        function exibirDetalhe(c) {
            document.querySelectorAll("#detalhe [data-campo]").forEach((el) => {
                const valor = c[el.dataset.campo];
                el.textContent = valor === null || valor === "" ? "—" : valor;
            });
            $("detalhe").classList.remove("oculto");
            $("detalhe").scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        $("formBusca").addEventListener("submit", (e) => {
            e.preventDefault();
            buscar($("termoBusca").value);
        });

        function trocarAba(qual) {
            const todos = qual === "todos";
            $("abaTodos").classList.toggle("ativa", todos);
            $("abaBuscar").classList.toggle("ativa", !todos);
            $("painelTodos").classList.toggle("oculto", !todos);
            $("painelBuscar").classList.toggle("oculto", todos);
            esconder($("msgBusca"));
            $("detalhe").classList.add("oculto");
            if (todos) carregarLista(); else $("termoBusca").focus();
        }
        $("abaTodos").addEventListener("click", () => trocarAba("todos"));
        $("abaBuscar").addEventListener("click", () => trocarAba("buscar"));

        $("btnSair").addEventListener("click", async () => {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/criptografia.html";
        });

        verificarLogin();
    </script>
</body>
</html>
