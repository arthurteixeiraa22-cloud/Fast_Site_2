<!DOCTYPE html>
<!-- TELA 1: LOGIN (endereço: http://localhost:8081/criptografia.html) -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="pagina-login">
        <h1 class="nome-autor">Arthur Martins Teixeira Coragem</h1>

        <div class="caixa-login">
            <h2>Entrar</h2>

            <form id="formLogin">
                <div class="grupo">
                    <label for="email">E-mail / Usuário</label>
                    <input type="email" id="email" placeholder="seu@email.com" required autofocus>
                </div>
                <div class="grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnEntrar">Entrar</button>
            </form>

            <div id="mensagem" class="alerta"></div>

            <button type="button" class="secundario" id="btnNovoCadastro">Não tem cadastro? Cadastre-se</button>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        function mostrar(elemento, texto, tipo) {
            elemento.textContent = texto;
            elemento.className = "alerta " + tipo;
        }

        // Se já estiver logado, vai direto para a tela do administrador
        fetch("/usuario").then(r => { if (r.ok) window.location.href = "/cadastro.html"; });

        $("btnNovoCadastro").addEventListener("click", () => {
            window.location.href = "/novo-cadastro.html";
        });

        $("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();

            const msg = $("mensagem");
            const botao = $("btnEntrar");
            msg.className = "alerta";
            botao.disabled = true;

            const dados = new URLSearchParams({
                email: $("email").value,
                senha: $("senha").value
            });

            try {
                const resposta = await fetch("/login", { method: "POST", body: dados });

                if (resposta.ok) {
                    window.location.href = "/cadastro.html";
                    return;
                }
                mostrar(msg, await resposta.text(), "erro");
            } catch {
                mostrar(msg, "Não foi possível falar com o servidor.", "erro");
            }
            botao.disabled = false;
        });
    </script>
</body>

</html>
